[project]
name = "kabu-app"
version = "0.1.0"
description = "kabu の取得バッチ・DB スキーマ・XBRL パーサ"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "alembic>=1.14",
    "httpx>=0.28",
    "lxml>=6.1.2",
    "pandas>=2.2",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0.36",
    "typer>=0.15",
    "xlrd>=2.0.1",
]

[project.scripts]
kabu = "kabu_app.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kabu_app"]

[dependency-groups]
dev = [
    "lxml-stubs>=0.5.1",
    "mypy>=1.14",
    "pandas-stubs>=2.2",
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# XBRL の断片をそのまま埋めているテスト。要素名が長く、折ると読めなくなる
"tests/test_edinet_xbrl.py" = ["E501"]
"tests/test_shareholders.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
